<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Rohan Padmanabhan · Projects</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo+Black&family=IBM+Plex+Mono&family=IBM+Plex+Sans:wght@400;500&display=swap">
<style>
:root{
  --bg:#f6f3f3; --card:#ffffff; --line:#e4dadb; --fg:#1d1517; --muted:#6e5f62; --accent:#d61414;
  --display:"Archivo Black","Arial Black",system-ui,sans-serif;
  --body:"IBM Plex Sans",system-ui,-apple-system,sans-serif;
  --mono:"IBM Plex Mono",ui-monospace,monospace;
}
@media (prefers-color-scheme: dark){:root{
  --bg:#0e0b0c; --card:#1a1416; --line:#3a2a2e; --fg:#f3e9ea; --muted:#a8969a; --accent:#ff3b3b; color-scheme:dark;
}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--fg);font-family:var(--body);font-size:16px;line-height:1.5}
main{max-width:36rem;margin:0 auto;padding-inline:16px;padding-block:calc(48px + env(safe-area-inset-top,0px)) 48px;display:flex;flex-direction:column;gap:32px}
h1{font-family:var(--display);font-size:2rem;margin:0;text-wrap:balance}
.eyebrow{font-family:var(--mono);font-size:.8rem;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);margin:0 0 8px}
ul{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:12px}
a.project{display:flex;justify-content:space-between;align-items:center;gap:16px;padding:18px 20px;background:var(--card);border:1px solid var(--line);border-radius:12px;color:inherit;text-decoration:none}
a.project:hover{border-color:var(--accent)}
a.project:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.name{font-weight:500;font-size:1.1rem}
.desc{color:var(--muted);font-size:.95rem;margin-top:2px}
.arrow{font-family:var(--mono);color:var(--accent);flex-shrink:0}
</style>
</head>
<body>
<main>
  <header>
    <p class="eyebrow">Rohan Padmanabhan</p>
    <h1>Projects</h1>
  </header>
  <ul>
    <li>
      <a class="project" href="bike-light/">
        <div>
          <div class="name">Bike Light</div>
          <div class="desc">Flashes your phone's torch and a red screen together. Chrome on Android.</div>
        </div>
        <span class="arrow" aria-hidden="true">→</span>
      </a>
    </li>
    <li>
      <a class="project" href="hot-potato/">
        <div>
          <div class="name">Hot Potato</div>
          <div class="desc">A pass-the-phone party game. Name something, pass it on, don't be holding it when it blows.</div>
        </div>
        <span class="arrow" aria-hidden="true">→</span>
      </a>
    </li>
  </ul>
</main>
</body>
</html>
